# Real-Time Chat Service — containerized microservices
# Services: web (Django + WebSockets), grpc (low-latency delivery),
#           db (PostgreSQL), redis (channel layer)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatdb}
      POSTGRES_USER: ${POSTGRES_USER:-chatuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatuser} -d ${POSTGRES_DB:-chatdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 myprojects.asgi:application"
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      GRPC_HOST: grpc
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      grpc:
        condition: service_started

  grpc:
    build: .
    command: python -m grpc_service.server
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: db
      GRPC_PORT: 50051
    volumes:
      - .:/app
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A myprojects worker --loglevel=info
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:

